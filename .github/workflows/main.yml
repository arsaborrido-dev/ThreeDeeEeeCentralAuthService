
name: Auth API CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Auth API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ThreeDeeEeeCentralAuthService.slnx

      - name: Build
        run: dotnet build ThreeDeeEeeCentralAuthService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ThreeDeeEeeCentralAuthService.slnx --configuration Release --no-build


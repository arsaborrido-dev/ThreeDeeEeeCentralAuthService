
name: Auth API CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "AuthApi/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Auth API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore AuthApi/AuthApi.csproj

      - name: Build
        run: dotnet build AuthApi/AuthApi.csproj --configuration Release --no-restore
